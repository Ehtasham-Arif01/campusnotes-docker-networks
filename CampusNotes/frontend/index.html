<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusNotes</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; background: #f4f6f8; color: #222; }
    h1 { color: #1a5276; }
    form { background: #fff; padding: 16px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    input, textarea { width: 100%; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { background: #1a5276; color: #fff; border: 0; padding: 10px 18px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #154360; }
    .note { background: #fff; margin-top: 12px; padding: 12px 16px; border-radius: 8px; border-left: 4px solid #1a5276; }
    .note h3 { margin: 0 0 6px; }
    .note small { color: #777; }
    #msg { color: #c0392b; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>CampusNotes</h1>

  <form id="noteForm">
    <label>Title</label>
    <input id="title" maxlength="120" placeholder="Note title (optional)">
    <label>Note</label>
    <textarea id="text" rows="4" maxlength="5000" placeholder="Write your note..." required></textarea>
    <button type="submit">Add Note</button>
    <div id="msg"></div>
  </form>

  <h2>All Notes</h2>
  <div id="notes"></div>

  <script>
    const API = `http://${location.hostname}:3000`;

    async function loadNotes() {
      const box = document.getElementById('notes');
      try {
        const res = await fetch(`${API}/notes`);
        const data = await res.json();
        box.innerHTML = '';
        if (data.length === 0) {
          box.textContent = 'No notes yet.';
          return;
        }
        data.forEach(n => {
          const div = document.createElement('div');
          div.className = 'note';
          const h3 = document.createElement('h3');
          h3.textContent = n.title;
          const p = document.createElement('p');
          p.textContent = n.text;
          const s = document.createElement('small');
          s.textContent = new Date(n.createdAt).toLocaleString();
          div.append(h3, p, s);
          box.appendChild(div);
        });
      } catch (e) {
        box.textContent = 'Could not load notes. Is the API running?';
      }
    }

    document.getElementById('noteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.textContent = '';
      const title = document.getElementById('title').value;
      const text = document.getElementById('text').value;
      try {
        const res = await fetch(`${API}/notes`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, text })
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || 'Failed to add note');
        }
        e.target.reset();
        loadNotes();
      } catch (err) {
        msg.textContent = err.message;
      }
    });

    loadNotes();
  </script>
</body>
</html>
